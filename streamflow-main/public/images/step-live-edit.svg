<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" role="img" aria-label="A 24/7 live stream running on air" transform="matrix(1, 0, 0, 1, 0, 0)">
  <rect width="320" height="200" fill="#0f0f0f"/>
  <!-- window top bar -->
  <rect width="320" height="34" fill="#f7f8fa"/>
  <line x1="0" y1="34" x2="320" y2="34" stroke="#e6e8eb" stroke-width="1" fill="#000000"/>
  <circle cx="20" cy="17" r="4" fill="#d0d5dd"/>
  <circle cx="36" cy="17" r="4" fill="#d0d5dd"/>
  <circle cx="52" cy="17" r="4" fill="#d0d5dd"/>
  <!-- stream preview -->
  <rect x="20" y="46" width="280" height="98" rx="10" fill="#eef0f3"/>
  <circle cx="160" cy="95" r="18" fill="#0f0f0f" stroke="#e6e8eb" stroke-width="1"/>
  <path d="M155 86 L155 104 L171 95 Z" fill="#f5f5f5"/>
  <!-- LIVE badge (on-air red dot) -->
  <rect x="32" y="58" width="54" height="20" rx="6" fill="#f5f5f5"/>
  <circle cx="44" cy="68" r="3.5" fill="#f20c0c"/>
  <text x="53" y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#0f0f0f">LIVE</text>
  <!-- viewer pill -->
  <rect x="244" y="58" width="44" height="20" rx="6" fill="#0f0f0f" fill-opacity="0.92"/>
  <circle cx="256" cy="68" r="3" fill="#f5f5f5"/>
  <rect x="263" y="65" width="18" height="6" rx="3" fill="#d0d5dd"/>
  <!-- bottom status row: On air + 24/7 (lime badge) -->
  <circle cx="28" cy="166" r="4" fill="#f20c0c"/>
  <rect x="38" y="162" width="64" height="9" rx="4.5" fill="#f5f5f5"/>
  <rect x="240" y="156" width="60" height="22" rx="7" fill="#2f83cc"/>
  <text x="270" y="171" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f5f5f5" text-anchor="middle">24/7</text>
</svg>
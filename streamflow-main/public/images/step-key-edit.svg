<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" role="img" aria-label="Choosing a platform and pasting the stream key">
  <rect width="320" height="200" fill="#0f0f0f"/>
  <!-- window top bar -->
  <rect width="320" height="34" fill="#f7f8fa"/>
  <line x1="0" y1="34" x2="320" y2="34" stroke="#e6e8eb" stroke-width="1" fill="#000000"/>
  <circle cx="20" cy="17" r="4" fill="#345a9c"/>
  <circle cx="36" cy="17" r="4" fill="#345a9c"/>
  <circle cx="52" cy="17" r="4" fill="#345a9c"/>
  <!-- platform tabs: first one active (lime) -->
  <rect x="20" y="46" width="64" height="24" rx="12" fill="#2f83cc"/>
  <circle cx="35" cy="58" r="5" fill="#0c111d"/>
  <rect x="45" y="55" width="30" height="6" rx="3" fill="#0c111d"/>
  <rect x="92" y="46" width="64" height="24" rx="12" fill="#f7f8fa" stroke="#e6e8eb" stroke-width="1"/>
  <circle cx="107" cy="58" r="5" fill="#345a9c"/>
  <rect x="117" y="55" width="30" height="6" rx="3" fill="#345a9c"/>
  <rect x="164" y="46" width="64" height="24" rx="12" fill="#f7f8fa" stroke="#e6e8eb" stroke-width="1"/>
  <circle cx="179" cy="58" r="5" fill="#345a9c"/>
  <rect x="189" y="55" width="30" height="6" rx="3" fill="#345a9c"/>
  <rect x="236" y="46" width="64" height="24" rx="12" fill="#f7f8fa" stroke="#e6e8eb" stroke-width="1"/>
  <circle cx="251" cy="58" r="5" fill="#345a9c"/>
  <rect x="261" y="55" width="30" height="6" rx="3" fill="#345a9c"/>
  <!-- field label -->
  <rect x="20" y="88" width="96" height="7" rx="3.5" fill="#345a9c"/>
  <!-- stream key input with masked dots -->
  <rect x="20" y="104" width="208" height="36" rx="8" fill="#f7f8fa" stroke="#345a9c" stroke-width="1.5"/>
  <circle cx="40" cy="122" r="3.5" fill="#0c111d"/>
  <circle cx="54" cy="122" r="3.5" fill="#0c111d"/>
  <circle cx="68" cy="122" r="3.5" fill="#0c111d"/>
  <circle cx="82" cy="122" r="3.5" fill="#0c111d"/>
  <circle cx="96" cy="122" r="3.5" fill="#0c111d"/>
  <circle cx="110" cy="122" r="3.5" fill="#0c111d"/>
  <circle cx="124" cy="122" r="3.5" fill="#345a9c"/>
  <circle cx="138" cy="122" r="3.5" fill="#345a9c"/>
  <!-- caret -->
  <rect x="150" y="112" width="2" height="20" rx="1" fill="#0c111d"/>
  <!-- confirm button (lime with dark check) -->
  <rect x="238" y="104" width="62" height="36" rx="8" fill="#2f83cc"/>
  <path d="M259 122 L266 129 L280 114" stroke="#0c111d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- helper hint -->
  <rect x="20" y="152" width="150" height="6" rx="3" fill="#8994ad"/>
  <!-- validated key row -->
  <rect x="20" y="168" width="280" height="22" rx="7" fill="#f7f8fa" stroke="#e6e8eb" stroke-width="1"/>
  <circle cx="34" cy="179" r="6" fill="#2f83cc"/>
  <path d="M31 179 L33.5 181.5 L37.5 176.5" stroke="#0c111d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="48" y="176" width="110" height="6" rx="3" fill="#345a9c"/>
</svg>
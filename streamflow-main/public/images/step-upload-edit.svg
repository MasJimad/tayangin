<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" role="img" aria-label="Uploading videos to the media library">
  <rect width="320" height="200" fill="#000000"/>
  <!-- window top bar -->
  <rect width="320" height="34" fill="#f7f8fa"/>
  <line x1="0" y1="34" x2="320" y2="34" stroke="#e6e8eb" stroke-width="1" fill="#000000"/>
  <circle cx="20" cy="17" r="4" fill="#d0d5dd"/>
  <circle cx="36" cy="17" r="4" fill="#d0d5dd"/>
  <circle cx="52" cy="17" r="4" fill="#d0d5dd"/>
  <!-- drag & drop zone -->
  <rect x="20" y="46" width="280" height="60" rx="10" fill="#f7f8fa" stroke="#d0d5dd" stroke-width="1.5" stroke-dasharray="6 5"/>
  <path d="M160 60 L160 82" stroke="#0c111d" stroke-width="2.5" stroke-linecap="round" fill="#000000"/>
  <path d="M151 69 L160 60 L169 69" stroke="#0c111d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="126" y="90" width="68" height="6" rx="3" fill="#d0d5dd"/>
  <!-- uploading file row with progress (lime) -->
  <rect x="20" y="120" width="40" height="30" rx="6" fill="#e6e8eb"/>
  <rect x="70" y="123" width="120" height="8" rx="4" fill="#d0d5dd"/>
  <rect x="70" y="139" width="230" height="6" rx="3" fill="#eef0f3"/>
  <rect x="70" y="139" width="150" height="6" rx="3" fill="#2f83cc"/>
  <!-- completed file row with lime check -->
  <rect x="20" y="160" width="40" height="26" rx="6" fill="#f7f8fa" stroke="#e6e8eb" stroke-width="1"/>
  <rect x="70" y="166" width="150" height="7" rx="3.5" fill="#eef0f3"/>
  <rect x="70" y="178" width="90" height="6" rx="3" fill="#eef0f3"/>
  <circle cx="290" cy="173" r="7" fill="#2f83cc"/>
  <path d="M286.5 173 L289.5 176 L294 170.5" stroke="#0c111d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>